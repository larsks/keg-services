volumes:
  prometheus-data:
  snmp-exporter-config:

services:
  prometheus:
    build:
      context: .
      dockerfile: Containerfile
    volumes:
      - prometheus-data:/prometheus
    networks:
      - services
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prom.keg.house`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=step-ca"

  snmp-generator:
    build:
      context: snmp-generator
      dockerfile: Containerfile
    command: ["generate", "-o", "/config/snmp.yaml"]
    volumes:
      - "snmp-exporter-config:/config"
    networks:
      - services

  snmp-exporter:
    image: quay.io/prometheus/snmp-exporter:v0.31.0
    restart: unless-stopped
    depends_on:
      snmp-generator:
        condition: service_completed_successfully
    volumes:
      - "snmp-exporter-config:/config"
    command: ["--config.file=/config/snmp.yaml"]
    networks:
      - services
