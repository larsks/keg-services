volumes:
  prometheus-data:
  snmp-exporter-config:

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.16.0
    volumes:
      - /volume1/docker/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - services
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prom.keg.house`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=step-ca"

  snmp-exporter-init:
    build:
      context: snmp-config-generator
      dockerfile: Containerfile
    command: ["generate", "-m", "/mibs", "-o", "/config/snmp.yaml"]
    volumes:
      - "snmp-exporter-config:/config"
    networks:
      - services

  snmp-exporter:
    image: quay.io/prometheus/snmp-exporter:v0.31.0
    depends_on:
      snmp-exporter-init:
        condition: service_completed_successfully
    volumes:
      - "snmp-exporter-config:/config"
    command: ["--config.file=/config/snmp.yaml"]
    networks:
      - services

