global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets:
          - "node-exporter:9100"
          - "madhatter:9100"
    relabel_configs:
      - source_labels: [__address__]
        regex: "node-exporter:9100"
        target_label: instance
        replacement: "keg"
