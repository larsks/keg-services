kind: "Dashboard"
metadata:
  name: "switches-interfaces"
  project: "switches"
spec:
  display:
    name: "Switches: interfaces"
  duration: 1h
  refreshInterval: 1m
  panels:
    link_status:
      kind: Panel
      spec:
        display:
          name: "Link status (1=up, 2=down, 3=testing)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values: [last]
            yAxis:
              show: true
              min: 0
              max: 3
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'ifOperStatus{instance=~"office-sw-.+"}'
                  seriesNameFormat: "{{instance}} {{ifName}} {{ifAlias}}"

    throughput:
      kind: Panel
      spec:
        display:
          name: "Interface throughput (bits/sec)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values: [last, max]
            yAxis:
              show: true
              label: "bits/sec"
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: '8 * rate(ifHCInOctets{instance=~"office-sw-.+"}[5m])'
                  seriesNameFormat: "{{instance}} {{ifName}} {{ifAlias}} rx"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: '8 * rate(ifHCOutOctets{instance=~"office-sw-.+"}[5m])'
                  seriesNameFormat: "{{instance}} {{ifName}} {{ifAlias}} tx"

    errors_discards:
      kind: Panel
      spec:
        display:
          name: "Interface errors and discards (per sec)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values: [last, max]
            yAxis:
              show: true
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'rate(ifInErrors{instance=~"office-sw-.+"}[5m])'
                  seriesNameFormat: "{{instance}} {{ifName}} in errors"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'rate(ifOutErrors{instance=~"office-sw-.+"}[5m])'
                  seriesNameFormat: "{{instance}} {{ifName}} out errors"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'rate(ifInDiscards{instance=~"office-sw-.+"}[5m])'
                  seriesNameFormat: "{{instance}} {{ifName}} in discards"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'rate(ifOutDiscards{instance=~"office-sw-.+"}[5m])'
                  seriesNameFormat: "{{instance}} {{ifName}} out discards"

    fcs_errors:
      kind: Panel
      spec:
        display:
          name: "FCS (CRC) errors (per sec)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values: [last, max]
            yAxis:
              show: true
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'rate(dot3StatsFCSErrors{instance=~"office-sw-.+"}[5m])'
                  seriesNameFormat: "{{instance}} {{ifName}}"

  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            y: 0
            width: 24
            height: 8
            content:
              "$ref": "#/spec/panels/link_status"
          - x: 0
            y: 8
            width: 24
            height: 8
            content:
              "$ref": "#/spec/panels/throughput"
          - x: 0
            y: 16
            width: 24
            height: 8
            content:
              "$ref": "#/spec/panels/errors_discards"
          - x: 0
            y: 24
            width: 24
            height: 8
            content:
              "$ref": "#/spec/panels/fcs_errors"
