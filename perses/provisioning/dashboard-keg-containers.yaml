kind: "Dashboard"
metadata:
  name: "keg-containers"
  project: "keg"
spec:
  display:
    name: "Keg containers"
  duration: 1h
  refreshInterval: 1m
  panels:
    cpu_usage:
      kind: Panel
      spec:
        display:
          name: "CPU usage by container (%)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values: [last]
            yAxis:
              show: true
              format:
                unit: percent
                decimalPlaces: 1
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'docker_container_cpu_usage_percentage{instance="docker-exporter:8080"}'
                  seriesNameFormat: "{{name}}"

    memory_usage:
      kind: Panel
      spec:
        display:
          name: "Memory usage by container"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values: [last]
            yAxis:
              show: true
              format:
                unit: bytes
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'docker_container_memory_usage_bytes{instance="docker-exporter:8080"}'
                  seriesNameFormat: "{{name}}"

    network_io:
      kind: Panel
      spec:
        display:
          name: "Network I/O by container (bytes/sec)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values: [last]
            yAxis:
              show: true
              format:
                unit: bytes
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (name) (rate(docker_container_network_receive_bytes_total{instance="docker-exporter:8080"}[5m]))'
                  seriesNameFormat: "{{name}} rx"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum by (name) (rate(docker_container_network_transmit_bytes_total{instance="docker-exporter:8080"}[5m]))'
                  seriesNameFormat: "{{name}} tx"

    restarts:
      kind: Panel
      spec:
        display:
          name: "Container restarts (total)"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: right
              mode: table
              size: small
              values: [last]
            yAxis:
              show: true
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'docker_container_restarts_total{instance="docker-exporter:8080"}'
                  seriesNameFormat: "{{name}}"

  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            y: 0
            width: 24
            height: 8
            content:
              "$ref": "#/spec/panels/cpu_usage"
          - x: 0
            y: 8
            width: 24
            height: 8
            content:
              "$ref": "#/spec/panels/memory_usage"
          - x: 0
            y: 16
            width: 24
            height: 8
            content:
              "$ref": "#/spec/panels/network_io"
          - x: 0
            y: 24
            width: 24
            height: 6
            content:
              "$ref": "#/spec/panels/restarts"
