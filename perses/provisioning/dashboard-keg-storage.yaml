kind: "Dashboard"
metadata:
  name: "keg-storage"
  project: "keg"
spec:
  display:
    name: "Keg storage"
  duration: 1h
  refreshInterval: 1m
  panels:
    raid_failed_gauge:
      kind: Panel
      spec:
        display:
          name: "Failed RAID disks (now)"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last
            format:
              unit: decimal
              decimalPlaces: 0
            max: 2
            thresholds:
              defaultColor: green
              steps:
                - value: 1
                  color: red
                  name: "Degraded"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'sum(node_md_disks{instance="keg", state="failed"})'

    raid_disks_trend:
      kind: Panel
      spec:
        display:
          name: "RAID disks by state"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last, min]
            yAxis:
              show: true
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'node_md_disks{instance="keg"}'
                  seriesNameFormat: "{{device}} {{state}}"

    fs_avail_gauge:
      kind: Panel
      spec:
        display:
          name: "Root filesystem available (now)"
        plugin:
          kind: GaugeChart
          spec:
            calculation: last
            format:
              unit: percent
              decimalPlaces: 1
            max: 100
            thresholds:
              defaultColor: red
              steps:
                - value: 10
                  color: orange
                  name: "Low"
                - value: 20
                  color: green
                  name: "Healthy"
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: '100 * node_filesystem_avail_bytes{instance="keg", mountpoint="/"} / node_filesystem_size_bytes{instance="keg", mountpoint="/"}'

    fs_avail_trend:
      kind: Panel
      spec:
        display:
          name: "Root filesystem space"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last, min]
            yAxis:
              show: true
              format:
                unit: bytes
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'node_filesystem_size_bytes{instance="keg", mountpoint="/"}'
                  seriesNameFormat: "size"
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'node_filesystem_avail_bytes{instance="keg", mountpoint="/"}'
                  seriesNameFormat: "available"

    btrfs_usage:
      kind: Panel
      spec:
        display:
          name: "Btrfs allocation by type"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last, max]
            yAxis:
              show: true
              format:
                unit: bytes
            visual:
              display: line
              lineWidth: 1.5
              areaOpacity: 0.1
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'node_btrfs_used_bytes{instance="keg"}'
                  seriesNameFormat: "{{block_group_type}} ({{mode}})"

    btrfs_allocation_ratio:
      kind: Panel
      spec:
        display:
          name: "Btrfs data allocation ratio"
        plugin:
          kind: TimeSeriesChart
          spec:
            legend:
              position: bottom
              mode: table
              values: [last, max]
            yAxis:
              show: true
            visual:
              display: line
              lineWidth: 1.5
              showPoints: auto
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'node_btrfs_allocation_ratio{instance="keg"}'
                  seriesNameFormat: "{{type}}"

  layouts:
    - kind: Grid
      spec:
        items:
          - x: 0
            y: 0
            width: 8
            height: 6
            content:
              "$ref": "#/spec/panels/raid_failed_gauge"
          - x: 8
            y: 0
            width: 16
            height: 6
            content:
              "$ref": "#/spec/panels/raid_disks_trend"
          - x: 0
            y: 6
            width: 8
            height: 6
            content:
              "$ref": "#/spec/panels/fs_avail_gauge"
          - x: 8
            y: 6
            width: 16
            height: 6
            content:
              "$ref": "#/spec/panels/fs_avail_trend"
          - x: 0
            y: 12
            width: 16
            height: 8
            content:
              "$ref": "#/spec/panels/btrfs_usage"
          - x: 16
            y: 12
            width: 8
            height: 8
            content:
              "$ref": "#/spec/panels/btrfs_allocation_ratio"
