volumes:
  perses-data:

services:
  perses:
    image: docker.io/persesdev/perses:v0.55.1
    command:
      - --config=/etc/perses/config.yaml
    environment:
      - GOGC=50
      - GOMEMLIMIT=96MiB
    volumes:
      - /volume1/docker/services/perses/config.yaml:/etc/perses/config.yaml
      - /volume1/docker/services/perses/provisioning:/etc/perses/provisioning
      - perses-data:/perses
    networks:
      - services
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perses.rule=Host(`perses.keg.house`)"
      - "traefik.http.services.perses.loadbalancer.server.port=8080"
      - "traefik.http.routers.perses.entrypoints=websecure"
      - "traefik.http.routers.perses.tls=true"
      - "traefik.http.routers.perses.tls.certresolver=step-ca"
