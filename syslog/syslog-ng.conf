source s_network {
    network(
        transport("tcp")
        port(514)
    );
    network(
        transport("udp")
        port(514)
    );
};

rewrite r_add_sourceip {
    set("$SOURCEIP", value(".SDATA.origin.ip"));
};

destination d_file {
    file("/logs/$SOURCEIP/$R_YEAR-$R_MONTH-$R_DAY.log"
    create-dirs(yes)
    perm(0640)
    group(101)
    dir-perm(0750)
    dir-group(101)
    );
};

destination d_loki {
    loki(
        url("loki:9096")
        labels(
            "host" => "$HOST",
            "severity" => "$SEVERITY",
            "facility" => "$FACILITY",
            "app_name" => "$PROGRAM",
            "source_ip" => "$SOURCEIP"
        )
        auth(insecure())
        workers(4)
        batch-timeout(10000)
        batch-lines(1000)
    );
};

log {
    source(s_network);
    rewrite(r_add_sourceip);
    destination(d_file);
    destination(d_loki);
};
