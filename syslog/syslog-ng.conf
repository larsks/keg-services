source s_network {
    network(
        transport("tcp")
        port(514)
    );
    network(
        transport("udp")
        port(514)
    );
};

rewrite r_add_sourceip {
    set("$SOURCEIP", value(".SDATA.origin.ip"));
};

destination d_file {
    file("/logs/$SOURCEIP/$R_YEAR-$R_MONTH-$R_DAY.log"
    create-dirs(yes)
    perm(0640)
    group(101)
    dir-perm(0750)
    dir-group(101)
    );
};

log {
    source(s_network);
    rewrite(r_add_sourceip);
    destination(d_file);
    destination(d_alloy_syslog);
};
