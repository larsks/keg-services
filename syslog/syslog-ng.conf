source s_network {
    network(
        transport("tcp")
        port(514)
    );
    network(
        transport("udp")
        port(514)
    );
};

destination d_alloy_syslog {
    syslog("127.0.0.1"
        transport("tcp")
        port(1514)
    );
};

destination d_file {
    file("logs/$SOURCEIP/$YEAR-$MONTH-$DAY.log"
    create-dirs(yes)
    perm(0640)
    group(101)
    dir-perm(0750)
    dir-group(101)
    );
};

log {
    source(s_network);
    destination(d_file);
};
