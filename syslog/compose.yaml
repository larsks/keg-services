services:
  syslog:
    image: ghcr.io/axoflow/axosyslog:4.29.0
    volumes:
      - /volume1/docker/syslog-ng/config/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf
      - /volume1/docker/syslog-ng/logs:/logs
    networks:
      house:
        ipv4_address: 192.168.1.211
    restart: unless-stopped

networks:
  house:
    external: true
