volumes:
  registry-data:

services:
  registry:
    image: docker.io/library/registry:3
    networks:
      - services
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.keg.house`)"
      - "traefik.http.services.registry.loadbalancer.server.port=5000"
      - "traefik.http.routers.registry.entrypoints=websecure"
      - "traefik.http.routers.registry.tls=true"
      - "traefik.http.routers.registry.tls.certresolver=step-ca"
      - "traefik.http.routers.registry.middlewares=registry-auth"
      - "traefik.http.middlewares.registry-auth.basicauth.users=lars:$2y$05$3KLHCPSvUKYFZfyiwG92zOoOJh4D0LQ0ewQR2AYo848kle0K2E8Vu"

networks:
  services:
    external: true
